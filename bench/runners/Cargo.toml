# Rust runners: our libraries through their Rust APIs, where the comparison
# is not a C ABI swap. Dependencies are the crates of this checkout. A
# workspace of its own, so the runners keep their own profile and lockfile.
[workspace]
members = ["vbrun", "varchive-run", "vbrotli-run", "vdns-run", "vfont-run", "vhttp-run", "vjpeg-run", "vjson-run", "vlz4-run", "vpng-run", "vregex-run", "vsnappy-run", "vurl-run", "vwebp-run", "vx509-run", "vxml-run", "vzlib-run"]
# Its own project: Verdict pins an older toolchain and its own vstd.
exclude = ["verdict-run"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
