# Verdict's side of the x509-verdict comparison. Its own project because
# Verdict pins Rust 1.86 (rust-toolchain.toml here) and its own vstd.
# work/verdict links to the checkout fetch.sh made.
[package]
name = "verdict-run"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
vbrun = { path = "../vbrun" }
verdict-parser = { path = "../../work/verdict/verdict-parser" }

[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
