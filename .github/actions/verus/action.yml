name: Verus
description: >-
  Puts cargo-verus and z3 on PATH: the Verus release in scripts/verus-version,
  downloaded and checked against its checksum (scripts/install-verus.sh).
runs:
  using: composite
  steps:
    - name: Install Verus
      shell: bash
      run: |
        scripts/install-verus.sh "$HOME/verus-bin"
        echo "$HOME/verus-bin" >> "$GITHUB_PATH"
        echo "VERUS_Z3_PATH=$HOME/verus-bin/z3" >> "$GITHUB_ENV"
