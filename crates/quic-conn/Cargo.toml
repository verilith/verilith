[package]
name = "verilith-quic-conn"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A sans-I/O QUIC server connection (RFC 9000, 9001, 9002) over verilith-quic's verified wire format and recovery and verilith-tls's verified handshake and packet protection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["quic", "http3", "verified", "verus", "server"]
categories = ["network-programming"]

[dependencies]
verilith-quic = { path = "../quic", version = "0.1.0" }
verilith-tls = { path = "../tls", version = "0.1.0" }
# Shared send buffers: a large write is kept, not copied (buf.rs).
bytes = "1.9"

[dev-dependencies]
# Path only, so that cargo publish leaves it out: the published crate does
# not need it, and it is published after this one (RELEASING.md).
verilith-tls-aws-lc = { path = "../tls-aws-lc" }
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
bytes = "1.9"
