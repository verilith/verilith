[package]
name = "verilith-webp"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["webp", "decoder", "image", "verified", "verus"]
categories = ["multimedia::images", "parser-implementations"]
description = "A formally verified (Verus) WebP decoder: lossless (VP8L) proven correct, lossy (VP8) proven safe, with libwebp's decoding C API"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Export the C API under libwebp's own symbol names.
webp-abi = []

[dependencies]
verilith-core = { path = "../core", version = "0.1.0" }
vstd = { workspace = true, features = ["std"] }
verilith-simd = { path = "../simd", version = "0.1.0" }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
