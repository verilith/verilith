[package]
name = "verilith-h3"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Sans-I/O HTTP/3 (RFC 9114) framing formally verified with Verus: varints, frames, stream types and the frame-order rules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["http3", "h3", "quic", "verified", "verus"]
categories = ["network-programming", "web-programming", "parser-implementations"]
exclude = ["scripts/", "bench/"]

[dependencies]
verilith-core = { path = "../core", version = "0.1.0" }
vstd = { workspace = true, features = ["std"] }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
