[package]
name = "verilith-tls-aws-lc"
version = "0.1.0"
edition = "2024"
description = "The cryptography of verilith-tls (AEAD, key exchange, signatures, random numbers), over aws-lc. Trusted."
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
publish = false

# Not a member of the workspace: aws-lc is C, and the workspace (and Buck)
# build only Rust. verilith-tls is verified without it.
[workspace]

[dependencies]
verilith-tls = { path = "../tls" }
verilith-x509 = { path = "../x509" }
aws-lc-rs = "1.19"
# Verified replacements for parts of aws-lc (CRYPTO.md): AES-GCM and AES
# header protection from verilith-aes, HMAC-SHA-256 for HPKE from
# verilith-sha2, ChaCha20-Poly1305 for tickets and HPKE from libcrux
# (HACL*).
verilith-aes = { path = "../aes" }
verilith-sha2 = { path = "../sha2" }
libcrux-chacha20poly1305 = "=0.0.11"

[dev-dependencies]
rustls = "0.23"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }

[profile.release]
lto = "fat"
codegen-units = 1
