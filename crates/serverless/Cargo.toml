[package]
name = "verilith-serverless"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A formally verified (Verus) serverless host: untrusted WebAssembly request handlers behind verilith-server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["wasm", "serverless", "sandbox", "verified", "verus"]
categories = ["wasm", "web-programming::http-server"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "verilith-serverless"
path = "src/bin/verilith-serverless.rs"

[dependencies]
verilith-core = { path = "../core", version = "0.1.0" }
verilith-http = { path = "../http", version = "0.1.0" }
verilith-server = { path = "../server", version = "0.1.0" }
verilith-wasm = { path = "../wasm", version = "0.1.0" }
vstd = { workspace = true, features = ["std"] }

[dev-dependencies]
wat = "=1.263.0"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
