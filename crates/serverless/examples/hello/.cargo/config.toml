[build]
target = "wasm32-unknown-unknown"

# verilith-wasm runs WebAssembly 2.0 without reference types or SIMD.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-cpu=mvp", "-C", "target-feature=+mutable-globals,+sign-ext,+bulk-memory,+nontrapping-fptoint,+multivalue",
  # A 64 KiB shadow stack instead of 1 MiB: less memory per worker thread
  "-C", "link-arg=-zstack-size=65536"]
