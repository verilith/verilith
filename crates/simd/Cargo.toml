[package]
name = "verilith-simd"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["simd", "intrinsics", "neon", "verus", "specification"]
categories = ["hardware-support"]
description = "Verus specifications for x86 SIMD intrinsics (SSE2..AVX2, some AVX-512) and AArch64 NEON, differentially tested against the CPU"
edition = "2024"
rust-version = "1.89"

[dependencies]
vstd = { workspace = true, features = ["std"] }

[dev-dependencies]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
