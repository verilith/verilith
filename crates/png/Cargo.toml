[package]
name = "verilith-png"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["png", "decoder", "image", "verified", "verus"]
categories = ["multimedia::images", "parser-implementations"]
description = "A formally verified (Verus) PNG decoder"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
vstd = { workspace = true, features = ["std"] }
verilith-core = { path = "../core", version = "0.1.0" }
verilith-zlib = { path = "../zlib", version = "0.1.0" }

[features]
# Export the libpng API under libpng's own names (`png_read_info`), not
# `vpng_read_info`, so that the static library is a drop-in libpng.
libpng-abi = []

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
