[package]
name = "verilith-hpack"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An HPACK (RFC 7541) header decoder formally verified with Verus, with nghttp2's inflater API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["hpack", "http2", "verified", "verus", "nghttp2"]
categories = ["network-programming", "web-programming", "parser-implementations"]
exclude = ["compat/", "scripts/", "tools/", "bench/"]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
verilith-core = { path = "../core", version = "0.1.0" }
vstd = { workspace = true, features = ["std"] }

[features]
# Export nghttp2's inflater functions (nghttp2_hd_inflate_*) for
# compat/nghttp2's patched nghttp2_hd.c.
nghttp2-abi = []

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
