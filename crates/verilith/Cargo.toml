[package]
name = "verilith"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Formally verified (Verus) drop-in replacements for foundational libraries: one crate that re-exports each verilith-* library behind a feature"
repository = "https://github.com/verilith/verilith"
readme = "README.md"
keywords = ["verified", "verus", "parser", "compression"]

# No code of its own: every feature turns on one library crate, and none is
# on by default.
[features]
default = []
archive = ["dep:verilith-archive"]
brotli = ["dep:verilith-brotli"]
core = ["dep:verilith-core"]
dns = ["dep:verilith-dns"]
font = ["dep:verilith-font"]
hpack = ["dep:verilith-hpack"]
http = ["dep:verilith-http"]
jpeg = ["dep:verilith-jpeg"]
json = ["dep:verilith-json"]
lz4 = ["dep:verilith-lz4"]
png = ["dep:verilith-png"]
regex = ["dep:verilith-regex"]
simd = ["dep:verilith-simd"]
snappy = ["dep:verilith-snappy"]
sync = ["dep:verilith-sync"]
text = ["dep:verilith-text"]
url = ["dep:verilith-url"]
wasm = ["dep:verilith-wasm"]
webp = ["dep:verilith-webp"]
x509 = ["dep:verilith-x509"]
xml = ["dep:verilith-xml"]
zlib = ["dep:verilith-zlib"]
zstd = ["dep:verilith-zstd"]

[dependencies]
verilith-archive = { path = "../archive", version = "0.1.0", optional = true }
verilith-brotli = { path = "../brotli", version = "0.1.0", optional = true }
verilith-core = { path = "../core", version = "0.1.0", optional = true }
verilith-dns = { path = "../dns", version = "0.1.0", optional = true }
verilith-font = { path = "../font", version = "0.1.0", optional = true }
verilith-hpack = { path = "../hpack", version = "0.1.0", optional = true }
verilith-http = { path = "../http", version = "0.1.0", optional = true }
verilith-jpeg = { path = "../jpeg", version = "0.1.0", optional = true }
verilith-json = { path = "../json", version = "0.1.0", optional = true }
verilith-lz4 = { path = "../lz4", version = "0.1.0", optional = true }
verilith-png = { path = "../png", version = "0.1.0", optional = true }
verilith-regex = { path = "../regex", version = "0.1.0", optional = true }
verilith-simd = { path = "../simd", version = "0.1.0", optional = true }
verilith-snappy = { path = "../snappy", version = "0.1.0", optional = true }
verilith-sync = { path = "../sync", version = "0.1.0", optional = true }
verilith-text = { path = "../text", version = "0.1.0", optional = true }
verilith-url = { path = "../url", version = "0.1.0", optional = true }
verilith-wasm = { path = "../wasm", version = "0.1.0", optional = true }
verilith-webp = { path = "../webp", version = "0.1.0", optional = true }
verilith-x509 = { path = "../x509", version = "0.1.0", optional = true }
verilith-xml = { path = "../xml", version = "0.1.0", optional = true }
verilith-zlib = { path = "../zlib", version = "0.1.0", optional = true }
verilith-zstd = { path = "../zstd", version = "0.1.0", optional = true }
