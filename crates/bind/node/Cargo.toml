[package]
name = "verilith-bind-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Node.js (Node-API) bindings for the Verilith parsers"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
verilith-bind = { path = ".." }
napi = { version = "2", default-features = false, features = ["napi9"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
