[package]
name = "verilith-bind-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Node.js (Node-API) bindings for the Verilith parsers"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
verilith-bind = { path = ".." }
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
