[package]
name = "verilith-zlib"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["zlib", "deflate", "gzip", "verified", "verus"]
categories = ["compression"]
description = "A formally verified (Verus) DEFLATE, zlib and gzip decompressor and compressor, with zlib's C API"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Export the C shim under zlib's and libdeflate's own symbol names.
zlib-abi = []
libdeflate-abi = []

[dependencies]
verilith-core = { path = "../core", version = "0.1.0" }
verilith-checksum = { path = "../checksum", version = "0.1.0" }
vstd = { workspace = true, features = ["std"] }

[package.metadata.verus]
verify = true

[lints.rust]
# Verus erases ghost code during a normal `cargo build`; ghost-only imports
# are guarded by `verus_only`, which Verus turns on during verification.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
