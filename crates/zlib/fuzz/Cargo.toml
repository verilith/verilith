test = false
doc = false

[[bin]]
name = "compress_vs_zlib"
path = "fuzz_targets/compress_vs_zlib.rs"
test = false
doc = false

[[bin]]
name = "c_deflate"
path = "fuzz_targets/c_deflate.rs"
test = false
doc = false
