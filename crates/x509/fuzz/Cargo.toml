[package]
name = "vx509-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
verilith-x509 = { path = "..", features = ["mbedtls"] }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mbedtls"
path = "fuzz_targets/mbedtls.rs"
test = false
doc = false
bench = false

[workspace]
