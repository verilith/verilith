[package]
name = "verilith-x509"
version = "0.1.0"
license = "MIT"
description = "A formally verified (Verus) DER and X.509 certificate parser"
edition = "2021"
repository = "https://github.com/verilith/verilith"
readme = "README.md"
keywords = ["x509", "der", "asn1", "verified", "verus"]
categories = ["cryptography", "parser-implementations", "encoding"]
exclude = ["fuzz/", "bench/", ".github/"]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["std"]
std = ["alloc"]
# oid_to_string. The parser itself never allocates.
alloc = []
# The C ABI behind the mbedTLS drop-in (mbedtls/).
mbedtls = []
# The native C API (include/vx509.h): the Rust API's zero-copy views.
capi = []

[dependencies]
vstd = { workspace = true }

[dev-dependencies]
x509-parser = "0.18"
x509-cert = { version = "0.2", default-features = false }
der = "0.7"
rustls-webpki = { version = "0.103", default-features = false }
rustls-pki-types = "1"
rcgen = "0.13"
openssl = "0.10"

[package.metadata.verus]
verify = true

[lints.rust]
# Ghost-only imports are guarded by `verus_only`, which Verus turns on during
# verification; see the vdns Cargo.toml for the details.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
