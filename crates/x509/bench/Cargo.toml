[package]
name = "x509bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
verilith-x509 = { path = ".." }
x509-parser = "0.18"
x509-cert = { version = "0.3", default-features = false }
der = "0.8"
rustls-webpki = { version = "0.103", default-features = false }
rustls-pki-types = "1"
openssl = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

[workspace]
