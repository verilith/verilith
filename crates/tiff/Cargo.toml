[package]
name = "verilith-tiff"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verilith/verilith"
keywords = ["tiff", "decoder", "image", "verified", "verus"]
categories = ["multimedia::images", "parser-implementations"]
description = "A formally verified (Verus) TIFF decoder"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Export the C API under libtiff's own names (TIFF*).
tiff-abi = []

[dependencies]
vstd = { workspace = true, features = ["std"] }
verilith-core = { path = "../core", version = "0.1.0" }
verilith-zlib = { path = "../zlib", version = "0.1.0" }

[build-dependencies]
cc = "1"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
