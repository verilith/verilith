[package]
name = "verilith-brotli"
version = "0.1.0"
license = "(MIT OR Apache-2.0) AND MIT"
description = "A formally verified (Verus) Brotli (RFC 7932) decompressor with google/brotli's decoder C API"
edition = "2024"
repository = "https://github.com/verilith/verilith"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Export the C API under google/brotli's own symbol names (BrotliDecoder*).
brotli-abi = []

[dependencies]
verilith-core = { path = "../core", version = "0.1.0" }
vstd = { workspace = true, features = ["std"] }

[package.metadata.verus]
verify = true

# Buck2 verifies this crate as several parts, each its own CI job
# (see BUILDING.md).
[package.metadata.verilith]
verify-parts = 2

[lints.rust]
# Verus erases ghost code during a normal `cargo build`; ghost-only imports
# are guarded by `verus_only`, which Verus turns on during verification.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
