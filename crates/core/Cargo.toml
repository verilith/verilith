[package]
name = "verilith-core"
version = "0.1.0"
license = "MIT"
description = "Formally verified (Verus) building blocks shared by the Verilith libraries: trusted memory primitives, byte and bit readers, canonical Huffman tables, UTF-8 validation, CRC-32 and Adler-32"
edition = "2024"
repository = "https://github.com/verilith/verilith"
keywords = ["verified", "verus", "huffman", "crc32", "utf8"]
categories = ["encoding", "parser-implementations"]

[features]
default = ["std"]
# Without `std` the crate is `no_std` and needs only `alloc`.
std = ["vstd/std"]

[dependencies]
vstd = { workspace = true, features = ["alloc"] }

[package.metadata.verus]
verify = true

[lints.rust]
# Verus erases ghost code during a normal `cargo build`; ghost-only imports
# are guarded by `verus_only`, which Verus turns on during verification.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
