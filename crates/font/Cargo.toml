[package]
name = "verilith-font"
version = "0.1.0"
license = "MIT"
description = "A formally verified (Verus) OpenType font sanitizer"
edition = "2021"
repository = "https://github.com/verilith/verilith"
readme = "README.md"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
vstd = { workspace = true, features = ["std"] }
verilith-zlib = { path = "../zlib", version = "0.1.0" }
verilith-brotli = { path = "../brotli", version = "0.1.0" }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
