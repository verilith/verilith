[package]
name = "vh2-bench"
publish = false
version = "0.1.0"
edition = "2024"

[dependencies]
verilith-h2 = { path = ".." }
h2 = { version = "0.4", features = ["unstable"] }
bytes = "1"
tokio = "1"
futures-core = "0.3"

[build-dependencies]
cc = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

# Its own project, outside the verilith workspace.
[workspace]
