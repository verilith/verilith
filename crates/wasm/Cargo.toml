[package]
name = "verilith-wasm"
version = "0.1.0"
license = "MIT AND Apache-2.0"
description = "A formally verified (Verus) WebAssembly validator and sandboxed interpreter"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
vstd = { workspace = true, features = ["std"] }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }

[dev-dependencies]
wast = "=263.0.0"
wat = "=1.263.0"
