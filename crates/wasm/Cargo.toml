[package]
name = "verilith-wasm"
version = "0.1.0"
license = "MIT"
description = "A formally verified (Verus) WebAssembly validator and sandboxed interpreter"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
vstd = { workspace = true, features = ["std"] }

[package.metadata.verus]
verify = true

# Buck2 verifies this crate as several parts, each its own CI job
# (see BUILDING.md).
[package.metadata.verilith]
verify-parts = 4

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }

[dev-dependencies]
wast = "=240.0.0"
wat = "=1.240.0"
