# Unbound for bench/run.sh: iterating from the test hierarchy's root
# (127.0.0.2), unsigned, so no DNSSEC validation (on both: verilith-resolver
# runs with --no-dnssec; bench/run-dnssec.sh compares them validating), and
# no QNAME minimisation (verilith-resolver sends the full name).
server:
    interface: 127.0.0.20@5300
    interface: 127.0.0.20@8530
    interface: 127.0.0.20@4430
    tls-port: 8530
    https-port: 4430
    tls-service-key: "@KEY@"
    tls-service-pem: "@CERT@"
    num-threads: @THREADS@
    so-reuseport: yes
    do-not-query-localhost: no
    access-control: 127.0.0.0/8 allow
    module-config: "iterator"
    qname-minimisation: no
    harden-referral-path: no
    target-fetch-policy: "0 0 0 0 0"
    chroot: ""
    username: ""
    directory: "@DIR@"
    pidfile: "@DIR@/unbound.pid"
    use-syslog: no
    logfile: ""
    verbosity: 0
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-max-ttl: 86400
    prefetch: no
    minimal-responses: yes
stub-zone:
    name: "."
    stub-addr: 127.0.0.2
