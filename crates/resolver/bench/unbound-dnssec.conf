# Unbound for bench/run-dnssec.sh: validating, iterating from the signed
# test hierarchy's root (127.0.1.2), with its trust anchor. No QNAME
# minimisation and no aggressive use of NSEC (RFC 8198), which
# verilith-resolver does not do either.
server:
    interface: 127.0.0.20@5300
    num-threads: @THREADS@
    so-reuseport: yes
    do-not-query-localhost: no
    access-control: 127.0.0.0/8 allow
    module-config: "validator iterator"
    trust-anchor: ". DS @DS@"
    aggressive-nsec: no
    qname-minimisation: no
    harden-referral-path: no
    target-fetch-policy: "0 0 0 0 0"
    chroot: ""
    username: ""
    directory: "@DIR@"
    pidfile: "@DIR@/unbound.pid"
    use-syslog: no
    logfile: ""
    verbosity: 0
    msg-cache-size: 64m
    rrset-cache-size: 128m
    key-cache-size: 16m
    cache-max-ttl: 86400
    prefetch: no
    minimal-responses: yes
stub-zone:
    name: "."
    stub-addr: 127.0.1.2
