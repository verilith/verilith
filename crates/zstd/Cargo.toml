[package]
name = "verilith-zstd"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "A formally verified (Verus) Zstandard (RFC 8878) decompressor with libzstd's C API"
edition = "2024"
repository = "https://github.com/verilith/verilith"
keywords = ["zstd", "zstandard", "decompression", "verified", "verus"]
categories = ["compression"]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Export the C shim's decompression functions under libzstd's own names.
zstd-abi = []
# Also export ZSTD_isError, ZSTD_getErrorName and the other functions that
# libzstd keeps in common/ (for builds that link no libzstd at all).
zstd-abi-common = ["zstd-abi"]

[dependencies]
verilith-core = { path = "../core", version = "0.1.0" }
verilith-xxhash = { path = "../xxhash", version = "0.1.0" }
vstd = { workspace = true, features = ["std"] }

[package.metadata.verus]
verify = true

[lints.rust]
# Verus erases ghost code during a normal `cargo build`; ghost-only imports
# are guarded by `verus_only`, which Verus turns on during verification.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
