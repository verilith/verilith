[workspace]
resolver = "3"
members = [
    "crates/archive",
    "crates/bind",
    "crates/brotli",
    "crates/core",
    "crates/dns",
    "crates/font",
    "crates/hpack",
    "crates/http",
    "crates/jpeg",
    "crates/json",
    "crates/lz4",
    "crates/png",
    "crates/regex",
    "crates/simd",
    "crates/snappy",
    "crates/sync",
    "crates/text",
    "crates/url",
    "crates/verilith",
    "crates/wasm",
    "crates/webp",
    "crates/x509",
    "crates/xml",
    "crates/zlib",
    "crates/zstd",
    "crates/bind/node",
    "crates/bind/python",
]
# The benchmark harness, and each crate's bench/, fuzz/ and compat/
# projects, are separate Cargo projects with their own lockfiles. So is the
# Node.js source crates/bind/scripts/build-node.sh unpacks under a target/
# directory: Node builds its own Rust crates there (deps/crates).
exclude = ["bench", "target", "crates/bind/target"]

[workspace.dependencies]
# The one Verus release every crate is verified with. The verifier itself is
# the release build of the matching commit: see scripts/verus-version.
vstd = { version = "=0.0.0-2026-11-01-0251", default-features = false }
verus_builtin = "=0.0.0-2026-11-01-0251"
verus_builtin_macros = "=0.0.0-2026-11-01-0251"
verus_state_machines_macros = "=0.0.0-2026-11-01-0251"

# Profiles are per workspace, not per crate. Before the monorepo each library
# set its own, and the three below reproduce them, so that a library built
# here is the same code as before. Which crate uses which is in
# scripts/profile (and each crate's own scripts go through it).
#
#   release        codegen-units 1, thin LTO
#   release-fat    codegen-units 1, fat LTO
#   release-abort  codegen-units 1, fat LTO, panic = abort
[profile.release]
codegen-units = 1
lto = "thin"

[profile.release-fat]
inherits = "release"
lto = "fat"

[profile.release-abort]
inherits = "release"
lto = "fat"
panic = "abort"

# release with debug info, for profilers.
[profile.profiling]
inherits = "release"
debug = true

[profile.prof]
inherits = "release-abort"
debug = true
